[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-log-analyzer"
version = "1.0.0"
description = "Find brute force, password spraying and web attacks in SSH and web server logs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tasmia Taskin Mubassira" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
log-analyzer = "log_analyzer.cli:main"

[tool.setuptools]
packages = ["log_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets the tests import the package straight from the project folder (no install needed).
pythonpath = ["."]
